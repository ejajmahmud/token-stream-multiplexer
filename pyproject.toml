[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-stream-multiplexer"
version = "0.1.0"
description = "Multi-agent stream multiplexer interleaving asynchronous token streams from concurrent LLM workers into an ordered unified multiplex"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
token-stream-multiplexer = "token_stream_multiplexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["token_stream_multiplexer*"]
